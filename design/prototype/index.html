<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小驴考试 · 备考工作台交互原型 v5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%236153d5%27/%3E%3Ctext x=%2716%27 y=%2723%27 text-anchor=%27middle%27 font-size=%2721%27 fill=%27white%27%3E%E9%A9%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<a href="#content" class="skip-link">跳到页面内容</a>
<div class="prototype-bar">
  <div class="prototype-copy"><strong>交互设计 v5</strong><span class="pill accent">规划原型 · 原创示例</span><span class="muted desktop-note">不连接真实资料、AI或思源；刷新重置示例</span></div>
  <div class="controls"><label for="scenario">状态演示</label><select id="scenario"><option value="ready">正常流程</option><option value="empty">无资料</option><option value="offline">离线 / 无 AI</option><option value="save-error">保存失败</option><option value="stale">来源已更新</option></select><button id="theme" aria-label="切换深色主题">深色</button><button id="reset">重置示例</button></div>
</div>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand-row"><a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">驴</span><span>小驴考试<small>LV EXAM</small></span></a><button class="quiet drawer-close" id="nav-close" aria-label="关闭主导航">×</button></div>
    <button class="project-switch" data-go="project">线性代数 · 阶段测验<small>大学课程 · 项目设置 ↗</small></button>
    <div><p class="nav-label">我的备考工作台</p><nav class="nav-list" id="nav"></nav></div>
    <div class="side-bottom"><button class="nav-btn" data-go="settings">设置与工具联动</button><p class="local-note">个人笔记与学习证据留在思源<br>原件副本、许可和 AI 外发分别确认</p></div>
  </aside>
  <button class="nav-backdrop" id="nav-backdrop" aria-label="关闭主导航" tabindex="-1" hidden></button>
  <div class="workspace">
    <header class="app-top"><div class="row"><button class="quiet mobile-menu" id="menu" aria-label="打开主导航" aria-expanded="false">☰</button><span class="breadcrumbs" id="breadcrumbs">线性代数 / 项目首页</span></div><div class="top-status"><span class="save-indicator" id="save-status" role="status">本地示例就绪</span><span class="desktop-note">思源 AI · 演示</span><button class="btn top-ai" data-action="ai-entry"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"></path></svg>AI 下一步</button></div></header>
    <div class="main-wrap"><nav class="subnav" id="subnav" aria-label="本模块页面"></nav><div id="state-message" aria-live="polite"></div><main id="content" tabindex="-1"></main></div>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="prototype.js"></script>
</body>
</html>
