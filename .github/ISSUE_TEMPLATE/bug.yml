name: Bug 反馈
description: 报告插件行为与预期不符（渲染/丢数据/报错请附诊断 JSON）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及**丢数据/渲染异常**的问题，请先在
        **报告中心 → 🩰 导出诊断信息（脱敏）** 复制 JSON 附在下方——它只含运行状态与统计口径，不含题目内容、key 或路径。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 期望什么 / 实际什么；报错请附控制台截图（Ctrl+Shift+I）
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 练习台 → 快速刷题
        2. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 思源版本 / 操作系统 / 前端（桌面或浏览器）
      placeholder: "思源 3.8.5 / Windows / 桌面端"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断 JSON（可选，脱敏）
  - type: checkboxes
    id: smoke
    attributes:
      label: 是否已有冒烟清单结果？
      description: "[docs/17](https://github.com/ai68298100/siyuan-exam/blob/main/docs/17-真机冒烟清单.md) 的步骤号 ✅/❌ 列表对定位极有帮助"
      options:
        - label: 我按清单跑过并附步骤号
